<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">One agent. Many worlds. A memory that lasts.</title>
  <desc id="desc">An illustrative SAWM and Basira memory architecture. Mission, task, and support contexts connect to an agent and model. Retrieved context and verified updates connect the agent to persistent memory stored outside the model. The memory layer preserves sources, state, and history.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .ink { fill: #f5f5f1; }
      .muted { fill: #a3a4a5; }
      .label { font-size: 12px; font-weight: 600; letter-spacing: 2px; }
      .fine { fill: none; stroke: #424348; stroke-width: 1.4; }
    </style>
    <image id="flower" x="-36" y="-36" width="72" height="72" href="data:image/svg+xml;base64,"/>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 0 5 3 1 6" fill="none" stroke="#9e9fa2" stroke-width="1.3"/>
    </marker>
  </defs>
  <rect width="1440" height="720" fill="#0b0c0e"/>
  <path d="M64 112H1376" stroke="#292a2e"/>
  <use href="#flower" transform="translate(88 65) scale(.62)" color="#f5f5f1"/>
  <text x="128" y="71" class="ink" font-size="18" font-weight="600" letter-spacing="3">SAWM <tspan fill="#66676b" font-weight="400">&amp;</tspan> Basira</text>
  <text x="1376" y="70" text-anchor="end" class="muted label">LONG-TERM AGENT MEMORY</text>

  <text x="64" y="214" class="ink" font-size="64" font-weight="600" letter-spacing="-2.8">One agent.</text>
  <text x="64" y="291" class="ink" font-size="64" font-weight="600" letter-spacing="-2.8">Many worlds.</text>
  <text x="64" y="368" class="ink" font-size="64" font-weight="400" letter-spacing="-2.8">A memory</text>
  <text x="64" y="445" class="ink" font-size="64" font-weight="400" letter-spacing="-2.8">that lasts.</text>
  <text x="67" y="510" class="muted" font-size="20">Carry context across missions, tasks,</text>
  <text x="67" y="541" class="muted" font-size="20">and support conversations.</text>
  <path d="M67 600H107" stroke="#ecece7" stroke-width="2"/>
  <text x="67" y="632" class="ink" font-size="14" font-weight="500">Continuity begins outside the model.</text>
  <text x="67" y="657" class="muted" font-size="13">An illustrative memory architecture</text>

  <!-- Three distinct worlds feed the same agent. -->
  <g>
    <rect x="716" y="155" width="204" height="123" rx="17" fill="#16171a" stroke="#35363b"/>
    <circle cx="747" cy="189" r="9" fill="none" stroke="#e6e6e1" stroke-width="1.5"/>
    <path d="m743 189 3 3 5-6" fill="none" stroke="#e6e6e1" stroke-width="1.5"/>
    <text x="738" y="232" class="ink" font-size="23" font-weight="500">Mission</text>
    <text x="738" y="255" class="muted" font-size="13">Goals and progress</text>
    <rect x="938" y="155" width="204" height="123" rx="17" fill="#16171a" stroke="#35363b"/>
    <rect x="960" y="178" width="19" height="23" rx="3" fill="none" stroke="#e6e6e1" stroke-width="1.5"/>
    <path d="m963 185 2 2 3-4m2 3h5m-12 8 2 2 3-4m2 3h5" fill="none" stroke="#e6e6e1" stroke-width="1.3"/>
    <text x="960" y="232" class="ink" font-size="23" font-weight="500">Tasks</text>
    <text x="960" y="255" class="muted" font-size="13">Progress and results</text>
    <rect x="1160" y="155" width="204" height="123" rx="17" fill="#16171a" stroke="#35363b"/>
    <path d="M1187 181h12a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3h-6l-6 4v-4a3 3 0 0 1-3-3v-8a3 3 0 0 1 3-3Z" fill="none" stroke="#e6e6e1" stroke-width="1.5"/>
    <text x="1182" y="232" class="ink" font-size="23" font-weight="500">Support</text>
    <text x="1182" y="255" class="muted" font-size="13">History and next steps</text>
  </g>
  <path d="M818 278v24q0 10 10 10h424q10 0 10-10v-24M1040 278v52" class="fine"/>
  <circle cx="1040" cy="312" r="4" fill="#b6b7b9"/>

  <!-- Model and memory have separate boundaries. -->
  <rect x="797" y="333" width="486" height="98" rx="20" fill="#efefea"/>
  <rect x="819" y="355" width="52" height="52" rx="13" fill="#dcdcd6"/>
  <use href="#flower" transform="translate(845 381) scale(.44)" color="#151618"/>
  <text x="890" y="375" fill="#101113" font-size="23" font-weight="600">Agent + model</text>
  <text x="890" y="402" fill="#535459" font-size="15">Reasons with retrieved context</text>

  <path d="M910 493v-52" fill="none" stroke="#9e9fa2" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M1170 440v52" fill="none" stroke="#9e9fa2" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="892" y="468" text-anchor="end" class="muted" font-size="12">Retrieve context</text>
  <text x="1188" y="468" class="muted" font-size="12">Verified updates</text>

  <rect x="716" y="499" width="648" height="167" rx="24" fill="#121316" stroke="#62636a" stroke-width="1.2"/>
  <path d="M743 542h18a7 7 0 0 0 1-14 11 11 0 0 0-21-1 7.5 7.5 0 0 0 2 15Z" fill="none" stroke="#d4d5d1" stroke-width="1.5"/>
  <text x="782" y="538" class="ink label">PERSISTENT MEMORY</text>
  <text x="1339" y="538" text-anchor="end" class="muted" font-size="12">Outside the model</text>
  <path d="M742 558H1338" stroke="#323338"/>
  <path d="M771 605H1309" stroke="#56575d" stroke-width="1.5"/>
  <circle cx="771" cy="605" r="6" fill="#efefea"/>
  <circle cx="1040" cy="605" r="6" fill="#efefea"/>
  <circle cx="1309" cy="605" r="6" fill="#efefea"/>
  <circle cx="1309" cy="605" r="12" fill="none" stroke="#56575d"/>
  <text x="771" y="635" text-anchor="middle" class="ink" font-size="14">Sources</text>
  <text x="1040" y="635" text-anchor="middle" class="ink" font-size="14">State</text>
  <text x="1309" y="635" text-anchor="middle" class="ink" font-size="14">History</text>
</svg>
